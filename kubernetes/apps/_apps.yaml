# App of Apps — root ArgoCD Application
# Apply once manually: kubectl apply -f kubernetes/apps/_apps.yaml
#
# Deployment order is managed by ArgoCD sync waves (wave annotation).
# Wave 0: infrastructure (cilium-config, cert-manager, democratic-csi, metrics-server)
# Wave 1: ingress (traefik, reflector)
# Wave 2: applications (monitoring, immich, actual-budget)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/nunosousa-dev/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/cilium-config
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/nunosousa-dev/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/cert-manager
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
