apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "nextcloud.local.nunosousa.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nextcloud-aio-apache
          port: 11000
