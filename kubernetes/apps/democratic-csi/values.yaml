# NFS driver (alias: nfs)
nfs:
  csiDriver:
    name: "org.democratic-csi.truenas-nfs"
    fsGroupPolicy: File

  storageClasses:
    - name: truenas-nfs-retain
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs
      mountOptions:
        - nfsvers=4.1
        - noatime
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:

    - name: truenas-nfs
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs
      mountOptions:
        - nfsvers=4.1
        - noatime
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:

  volumeSnapshotClasses: []

  driver:
    existingConfigSecret: truenas-nfs-config

# iSCSI driver (alias: iscsi)
iscsi:
  csiDriver:
    name: "org.democratic-csi.truenas-iscsi"

  storageClasses:
    - name: truenas-iscsi-retain
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4
      mountOptions: []
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:

  volumeSnapshotClasses: []

  node:
    hostPID: true
    driver:
      extraEnv:
        - name: ISCSIADM_HOST_STRATEGY
          value: nsenter
        - name: ISCSIADM_HOST_PATH
          value: /usr/local/sbin/iscsiadm
      iscsiDirHostPath: /etc/iscsi
      iscsiDirHostPathType: ""

  driver:
    existingConfigSecret: truenas-iscsi-config