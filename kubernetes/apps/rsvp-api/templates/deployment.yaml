apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsvp-api
  namespace: benedita
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rsvp-api
  template:
    metadata:
      labels:
        app: rsvp-api
    spec:
      nodeSelector:
        homelab/node-type: vm
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rsvp-api
          image: {{ .Values.image }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RSVP_DB_PATH
              value: /data/rsvp.db
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rsvp-api-data
        - name: tmp
          emptyDir: {}
