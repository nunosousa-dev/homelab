apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rsvp-api
  namespace: benedita
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - {{ .Values.internalHostname | quote }}
    - {{ .Values.publicHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: rsvp-api
          port: 8000
          weight: 1
