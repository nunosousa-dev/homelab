apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rsvp-admin
  namespace: benedita
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  # Internal hostname only — the Cloudflare tunnel does not forward this host,
  # so /admin is reachable only from the local network.
  hostnames:
    - {{ .Values.internalHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - group: ""
          kind: Service
          name: rsvp-api
          port: 8000
          weight: 1
