apiVersion: v1
kind: Service
metadata:
  name: actual-budget-service
  namespace: actual-budget
spec:
  selector:
    app: actual-budget
  ports:
    - port: 80
      targetPort: 5006
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  parentRefs:
    - group: ""
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - { { .Values.hostname | quote } }
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: actual-budget-service
          port: 80
          weight: 1
