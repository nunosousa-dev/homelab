apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.data.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.storage.media.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.media.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.storage.consume.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.consume.size }}
