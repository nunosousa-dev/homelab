apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-data-pv
spec:
  capacity:
    storage: {{ .Values.storage.data.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: {{ .Values.storage.nfsServer }}
    path: {{ .Values.storage.data.nfsPath }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-data-pv
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
---
