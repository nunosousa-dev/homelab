hostnames:
  sonarr: sonarr.local.nunosousa.dev
  radarr: radarr.local.nunosousa.dev
  prowlarr: prowlarr.local.nunosousa.dev
  lidarr: lidarr.local.nunosousa.dev
  bazarr: bazarr.local.nunosousa.dev
  qbittorrent: qbittorrent.local.nunosousa.dev
  tdarr: tdarr.local.nunosousa.dev

sonarr:
  image: linuxserver/sonarr:4.0.14
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 5Gi

radarr:
  image: linuxserver/radarr:6.1.1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 5Gi

prowlarr:
  image: linuxserver/prowlarr:1.32.2
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 2Gi

lidarr:
  image: linuxserver/lidarr:2.11.2
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 5Gi

bazarr:
  image: linuxserver/bazarr:1.5.1
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 2Gi

qbittorrent:
  image: linuxserver/qbittorrent:5.0.4
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 2Gi

tdarr:
  image: ghcr.io/haveagitgat/tdarr:2.42.01
  nodeImage: ghcr.io/haveagitgat/tdarr_node:2.42.01
  serverResources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  nodeResources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 5Gi

flaresolverr:
  image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "512Mi"
      cpu: "500m"

media:
  nfsServer: 10.0.0.3
  nfsPath: /mnt/data/media
  size: 500Gi

metrics:
  enabled: true
  exportarr:
    image: ghcr.io/onedr0p/exportarr:v2.1.0
    resources:
      requests:
        memory: "32Mi"
        cpu: "5m"
      limits:
        memory: "64Mi"
        cpu: "50m"
  qbittorrentExporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    resources:
      requests:
        memory: "32Mi"
        cpu: "5m"
      limits:
        memory: "64Mi"
        cpu: "50m"
