  qbittorrent: qbittorrent.local.nunosousa.dev

sonarr:
  image: linuxserver/sonarr:4.0.14
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    storageClassName: truenas-iscsi-retain
    size: 5Gi

