apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      nodeSelector:
        homelab/node-type: rpi
      tolerations:
        - key: homelab/node-type
          operator: Equal
          value: rpi
          effect: NoExecute
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: tdarr
          image: {{ .Values.tdarr.image }}
          ports:
            - name: webui
              containerPort: 8265
              protocol: TCP
            - name: server
              containerPort: 8266
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Lisbon
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
          startupProbe:
            tcpSocket:
              port: 8265
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8265
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8265
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.tdarr.serverResources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: server-data
              mountPath: /app/server
            - name: media
              mountPath: /media
            - name: transcode-cache
              mountPath: /temp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config
        - name: server-data
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: arr-stack-media
        - name: transcode-cache
          emptyDir:
            sizeLimit: 10Gi
