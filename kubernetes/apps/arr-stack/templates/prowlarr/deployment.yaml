apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      nodeSelector:
        homelab/node-type: rpi
      tolerations:
        - key: homelab/node-type
          value: rpi
          effect: NoExecute
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: prowlarr
          image: {{ .Values.prowlarr.image }}
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Lisbon
          startupProbe:
            tcpSocket:
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9696
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9696
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{ toYaml .Values.prowlarr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
        {{- if .Values.metrics.enabled }}
        - name: exportarr
          image: {{ .Values.metrics.exportarr.image }}
          args:
            - prowlarr
          env:
            - name: URL
              value: "http://localhost:9696"
            - name: PORT
              value: "9707"
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: arr-stack-api-keys
                  key: prowlarr
          ports:
            - name: metrics
              containerPort: 9707
              protocol: TCP
          resources:
            {{- toYaml .Values.metrics.exportarr.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
