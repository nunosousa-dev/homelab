apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: arr-stack
  {{- if .Values.metrics.enabled }}
  labels:
    app: qbittorrent
    metrics: qbittorrent-exporter
  {{- end }}
spec:
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: bittorrent
      port: 6881
      targetPort: 6881
      protocol: TCP
    - name: bittorrent-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9022
      targetPort: 9022
      protocol: TCP
    {{- end }}
