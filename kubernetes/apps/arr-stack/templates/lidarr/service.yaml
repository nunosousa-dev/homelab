apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: arr-stack
  {{- if .Values.metrics.enabled }}
  labels:
    app: lidarr
    metrics: exportarr
  {{- end }}
spec:
  selector:
    app: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: 8686
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9707
      targetPort: 9707
      protocol: TCP
    {{- end }}
