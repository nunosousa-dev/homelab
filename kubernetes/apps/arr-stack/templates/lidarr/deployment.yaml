apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: arr-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      nodeSelector:
        homelab/node-type: rpi
      tolerations:
        - key: homelab/node-type
          operator: Equal
          value: rpi
          effect: NoExecute
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: lidarr
          image: {{ .Values.lidarr.image }}
          ports:
            - name: http
              containerPort: 8686
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Lisbon
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8686
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8686
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8686
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.lidarr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-stack-media
