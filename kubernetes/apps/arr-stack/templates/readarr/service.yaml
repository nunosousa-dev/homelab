apiVersion: v1
kind: Service
metadata:
  name: readarr
  namespace: arr-stack
  {{- if .Values.metrics.enabled }}
  labels:
    app: readarr
    metrics: exportarr
  {{- end }}
spec:
  selector:
    app: readarr
  ports:
    - name: http
      port: 8787
      targetPort: 8787
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9707
      targetPort: 9707
      protocol: TCP
    {{- end }}
