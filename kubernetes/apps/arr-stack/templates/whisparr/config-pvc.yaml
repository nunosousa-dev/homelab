apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisparr-config
  namespace: arr-stack
  annotations:
    "helm.sh/resource-policy": keep
spec:
  storageClassName: {{ .Values.whisparr.config.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.whisparr.config.size }}
