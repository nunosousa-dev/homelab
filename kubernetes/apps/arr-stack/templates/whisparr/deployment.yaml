apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisparr
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisparr
  template:
    metadata:
      labels:
        app: whisparr
    spec:
      nodeSelector:
        homelab/node-type: vm
      tolerations:
        - key: homelab/node-type
          operator: Equal
          value: vm
          effect: NoExecute
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: whisparr
          image: {{ .Values.whisparr.image }}
          ports:
            - name: http
              containerPort: 6969
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Lisbon
          startupProbe:
            tcpSocket:
              port: 6969
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 6969
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6969
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.whisparr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: whisparr-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-stack-media
