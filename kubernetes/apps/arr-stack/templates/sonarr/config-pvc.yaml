apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: arr-stack
  annotations:
    "helm.sh/resource-policy": keep
spec:
  storageClassName: {{ .Values.sonarr.config.storageClassName }}
  volumeName: {{ .Values.sonarr.config.volumeName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sonarr.config.size }}
