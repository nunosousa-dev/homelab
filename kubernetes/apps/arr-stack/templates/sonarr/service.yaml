apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: arr-stack
  {{- if .Values.metrics.enabled }}
  labels:
    app: sonarr
    metrics: exportarr
  {{- end }}
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: 8989
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9707
      targetPort: 9707
      protocol: TCP
    {{- end }}
