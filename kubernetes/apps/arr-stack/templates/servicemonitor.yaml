{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: arr-stack-exportarr
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: arr-stack
    app.kubernetes.io/component: metrics
spec:
  selector:
    matchLabels:
      metrics: exportarr
  namespaceSelector:
    matchNames:
      - arr-stack
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: arr-stack-qbittorrent
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: arr-stack
    app.kubernetes.io/component: metrics
spec:
  selector:
    matchLabels:
      metrics: qbittorrent-exporter
  namespaceSelector:
    matchNames:
      - arr-stack
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
{{- end }}
