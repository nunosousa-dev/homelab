apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rreading-glasses-db-data
  namespace: arr-stack
spec:
  storageClassName: {{ .Values.rreadingGlasses.postgres.storage.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rreadingGlasses.postgres.storage.size }}
