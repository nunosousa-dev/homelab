# This is a placeholder secret template.
# In production, replace this with a SealedSecret containing your actual credentials.
#
# To create a SealedSecret:
# kubectl create secret generic rreading-glasses-credentials \
#   --namespace arr-stack \
#   --from-literal=hardcover-auth="Bearer <your token from hardcover.app/settings -> API>" \
#   --from-literal=postgres-password="<random string, no special symbols>" \
#   --dry-run=client -o yaml | kubeseal -o yaml > rreading-glasses-credentials-sealed.yaml
#
# Note: Your Hardcover API token expires every year on January 1 and must be renewed.
apiVersion: v1
kind: Secret
metadata:
  name: rreading-glasses-credentials
  namespace: arr-stack
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  # Replace these placeholder values with your actual credentials
  # Or better: use SealedSecrets and delete this file
  hardcover-auth: "Bearer REPLACE_WITH_HARDCOVER_API_TOKEN"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"
