hostname: jellyfin.local.nunosousa.dev

jellyfin:
  image: jellyfin/jellyfin:10.10.7
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "2000m"

config:
  storageClassName: truenas-iscsi-retain
  size: 10Gi

media:
  nfsServer: 10.0.0.3
  nfsPath: /mnt/data/media
  size: 500Gi
