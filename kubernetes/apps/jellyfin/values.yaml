hostname: jellyfin.local.nunosousa.dev

jellyfin:
  image: jellyfin/jellyfin:10.11.11
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "6000m"

config:
  storageClassName: truenas-iscsi-retain
  size: 10Gi

media:
  nfsServer: 10.0.0.3
  nfsPath: /mnt/data/media
  size: 500Gi
