apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-app
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nextcloud.app.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.app.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-userdata
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nextcloud.userData.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.userData.size }}
