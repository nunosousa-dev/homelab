apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-backup
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.backup.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
