apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-userdata-pv
spec:
  capacity:
    storage: {{ .Values.nextcloud.userData.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.basePath }}/userdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-userdata
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: nextcloud-userdata-pv
  resources:
    requests:
      storage: {{ .Values.nextcloud.userData.size }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-backup-pv
spec:
  capacity:
    storage: {{ .Values.backup.storage.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.basePath }}/backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-backup
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: nextcloud-backup-pv
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
