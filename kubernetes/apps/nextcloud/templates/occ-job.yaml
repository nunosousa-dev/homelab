apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-occ-setup
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: occ
          image: {{ .Values.nextcloud.image }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          command:
            - /bin/sh
            - -c
            - |
              set -e
              php /var/www/html/occ maintenance:repair --include-expensive --no-interaction
              php /var/www/html/occ db:add-missing-indices --no-interaction
              php /var/www/html/occ config:system:set trusted_domains 1 \
                --value={{ .Values.hostname }}
              php /var/www/html/occ config:system:set trusted_domains 2 \
                --value={{ .Values.publicHostname }}
              php /var/www/html/occ config:system:set maintenance_window_start \
                --value={{ .Values.nextcloud.maintenanceWindowStart }} --type=integer
              php /var/www/html/occ config:system:set default_phone_region \
                --value={{ .Values.nextcloud.defaultPhoneRegion }}
          volumeMounts:
            - name: nextcloud-app
              mountPath: /var/www/html
            - name: nextcloud-userdata
              mountPath: /var/www/html/data
      volumes:
        - name: nextcloud-app
          persistentVolumeClaim:
            claimName: nextcloud-app
        - name: nextcloud-userdata
          persistentVolumeClaim:
            claimName: nextcloud-userdata
      restartPolicy: OnFailure
