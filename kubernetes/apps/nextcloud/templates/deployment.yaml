apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nextcloud
          image: {{ .Values.nextcloud.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_PORT
              value: "6379"
            - name: NEXTCLOUD_ADMIN_USER
              value: {{ .Values.nextcloud.adminUser }}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ .Values.hostname }}
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://{{ .Values.hostname }}
            - name: TRUSTED_PROXIES
              value: 10.0.0.0/8
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/html/data
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            initialDelaySeconds: {{ .Values.nextcloud.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nextcloud.startupProbe.periodSeconds }}
            timeoutSeconds: 10
            failureThreshold: {{ .Values.nextcloud.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
          volumeMounts:
            - name: nextcloud-app
              mountPath: /var/www/html
            - name: nextcloud-userdata
              mountPath: /var/www/html/data
            - name: apache-config
              mountPath: /etc/apache2/conf-enabled/servername.conf
              subPath: servername.conf
      volumes:
        - name: nextcloud-app
          persistentVolumeClaim:
            claimName: nextcloud-app
        - name: nextcloud-userdata
          persistentVolumeClaim:
            claimName: nextcloud-userdata
        - name: apache-config
          configMap:
            name: nextcloud-apache-config
