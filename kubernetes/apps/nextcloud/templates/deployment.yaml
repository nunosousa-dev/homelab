apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nextcloud-config.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        homelab/node-type: vm
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nextcloud
          image: {{ .Values.nextcloud.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            initialDelaySeconds: {{ .Values.nextcloud.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nextcloud.startupProbe.periodSeconds }}
            timeoutSeconds: 10
            failureThreshold: {{ .Values.nextcloud.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: {{ .Values.hostname }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
          volumeMounts:
            - name: nextcloud-app
              mountPath: /var/www/html
            - name: nextcloud-userdata
              mountPath: /var/www/html/data
            - name: apache-config
              mountPath: /etc/apache2/conf-enabled/servername.conf
              subPath: servername.conf
      volumes:
        - name: nextcloud-app
          persistentVolumeClaim:
            claimName: nextcloud-app
        - name: nextcloud-userdata
          persistentVolumeClaim:
            claimName: nextcloud-userdata
        - name: apache-config
          configMap:
            name: nextcloud-apache-config
