apiVersion: v1
kind: Namespace
metadata:
  name: actual-budget
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "zax0WKdgDF5OzlfjCvA3DwJxWK9N6_cmilXJGUqM"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  selector:
    matchLabels:
      app: actual-budget
  replicas: 1
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      containers:
        - image: actualbudget/actual-server
          imagePullPolicy: Always
          name: actual-budget
          ports:
            - containerPort: 5006
---
apiVersion: v1
kind: Service
metadata:
  name: actual-budget-service
  namespace: actual-budget
spec:
  selector:
    app: actual-budget
  ports:
    - port: 80
      targetPort: 5006
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nunosousa.pt@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            email: nunosousa.pt@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: actual-budget
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.nunosousa.dev"
    - "nunosousa.dev"  # Include apex domain if needed
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget-ingress
  namespace: actual-budget
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
    - hosts:
        - "*.nunosousa.dev"
        - "nunosousa.dev"
      secretName: wildcard-tls
  rules:
    - host: actual.nunosousa.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-budget-service
                port:
                  number: 80