apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: all-local-nunosousa-dev
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: all-local-nunosousa-dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.local.nunosousa.dev"
  dnsNames:
    - "local.nunosousa.dev"
    - "*.local.nunosousa.dev"
