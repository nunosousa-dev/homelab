apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    # Single canonical hostname for both internal and public access (split-horizon
    # DNS resolves this to the internal Traefik LB on the LAN). OpenCloud bakes
    # OC_URL into the Web UI config and enforces a same-origin CSP, so it can only
    # serve one hostname. See OC_URL in deployment.yaml.
    - {{ .Values.publicHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: opencloud-headers
      backendRefs:
        - group: ""
          kind: Service
          name: opencloud
          port: 80
          weight: 1
