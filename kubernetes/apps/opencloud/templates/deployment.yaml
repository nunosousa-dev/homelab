apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opencloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "opencloud.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      nodeSelector:
        homelab/node-type: vm
      securityContext:
        runAsUser: {{ .Values.opencloud.securityContext.runAsUser }}
        runAsGroup: {{ .Values.opencloud.securityContext.runAsGroup }}
        fsGroup: {{ .Values.opencloud.securityContext.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Generate the OpenCloud configuration and service secrets in
        # /etc/opencloud on first boot. `|| true` makes it idempotent so the
        # pod can restart without overwriting the existing config.
        - name: init
          image: {{ .Values.opencloud.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - opencloud init --insecure {{ .Values.opencloud.insecure }} || true
          env:
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secret
                  key: IDM_ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
      containers:
        - name: opencloud
          image: {{ .Values.opencloud.image }}
          imagePullPolicy: Always
          command: ["opencloud", "server"]
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          env:
            - name: OC_URL
              value: https://{{ .Values.publicHostname }}
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: OC_BASE_DATA_PATH
              value: /var/lib/opencloud
            # Bind the proxy on all interfaces so the Service can reach it.
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            # TLS is terminated at Traefik; serve plain HTTP internally.
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: {{ .Values.opencloud.insecure | quote }}
            - name: OC_LOG_LEVEL
              value: {{ .Values.opencloud.logLevel | quote }}
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            # Use the messagepack metadata backend so OpenCloud does not rely on
            # NFS extended attributes for the decomposedfs storage driver.
            # NOTE: the env var must include 'FS' — DECOMPOSEDFS not DECOMPOSED.
            - name: STORAGE_USERS_DECOMPOSEDFS_METADATA_BACKEND
              value: {{ .Values.opencloud.metadataBackend | quote }}
{{- if .Values.collabora.enabled }}
            # Custom Content-Security-Policy so the OpenCloud Web UI is allowed to
            # frame Collabora and talk to the WOPI service on their own subdomains.
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud-csp/csp.yaml
{{- end }}
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secret
                  key: IDM_ADMIN_PASSWORD
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.opencloud.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
{{- if .Values.collabora.enabled }}
            - name: csp
              mountPath: /etc/opencloud-csp
              readOnly: true
        # OpenCloud collaboration (WOPI) service. Runs in the same pod so it
        # shares the generated /etc/opencloud secrets and reaches the in-pod nats
        # service registry over localhost.
        - name: collaboration
          image: {{ .Values.opencloud.image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until wget -qO- "$COLLABORATION_APP_ADDR/hosting/discovery" >/dev/null; do
                echo "waiting for Collabora discovery at $COLLABORATION_APP_ADDR"
                sleep 5
              done
              exec opencloud collaboration server
          ports:
            - name: wopi
              containerPort: 9300
              protocol: TCP
            - name: wopi-debug
              containerPort: 9304
              protocol: TCP
            - name: wopi-grpc
              containerPort: 9301
              protocol: TCP
          env:
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: OC_URL
              value: https://{{ .Values.publicHostname }}
            - name: OC_INSECURE
              value: {{ .Values.opencloud.insecure | quote }}
            - name: OC_LOG_LEVEL
              value: {{ .Values.opencloud.logLevel | quote }}
            # Discover the in-pod OpenCloud services via the shared nats registry.
            - name: MICRO_REGISTRY
              value: nats-js-kv
            - name: MICRO_REGISTRY_ADDRESS
              value: 127.0.0.1:9233
            - name: COLLABORATION_HTTP_ADDR
              value: 0.0.0.0:9300
            # Expose the debug/health server (default binds to 127.0.0.1) so the
            # kubelet readiness probe can reach /readyz from the pod IP.
            - name: COLLABORATION_DEBUG_ADDR
              value: 0.0.0.0:9304
            # Public URL of this WOPI service (what Collabora calls back to).
            - name: COLLABORATION_WOPI_SRC
              value: https://{{ .Values.collaboration.hostname }}
            - name: COLLABORATION_APP_NAME
              value: Collabora
            - name: COLLABORATION_APP_PRODUCT
              value: Collabora
            # Server-to-server discovery URL. Use the in-cluster Collabora Service
            # to avoid hair-pinning out through Cloudflare and to remove the
            # dependency on external DNS/cert. Collabora's server_name still makes
            # the discovery document return public https://collabora.* editor URLs
            # for the browser.
            - name: COLLABORATION_APP_ADDR
              value: http://collabora.{{ .Release.Namespace }}.svc.cluster.local
            - name: COLLABORATION_APP_INSECURE
              value: {{ .Values.opencloud.insecure | quote }}
            - name: COLLABORATION_WOPI_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-secret
                  key: COLLABORATION_WOPI_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: wopi-debug
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.collaboration.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
{{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
{{- if .Values.collabora.enabled }}
        - name: csp
          configMap:
            name: opencloud-csp
{{- end }}
