apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencloud-headers
  namespace: opencloud
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    browserXssFilter: true
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
      Referrer-Policy: "no-referrer"
