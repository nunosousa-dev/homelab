apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencloud-headers
  namespace: opencloud
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    browserXssFilter: true
    # The Cloudflare tunnel terminates public TLS at the edge and forwards plain
    # HTTP to Traefik, so Traefik would otherwise pass X-Forwarded-Proto: http to
    # OpenCloud. With OC_URL set to https, OpenCloud's proxy then 308-redirects
    # http->https on every request, causing an infinite loop. Force the header to
    # https (the original public/edge scheme is always https) to break the loop.
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
      Referrer-Policy: "no-referrer"
{{- if .Values.collabora.enabled }}
---
# Forwarded-proto only (no X-Frame-Options). Used by the Collabora and WOPI
# routes: Collabora is embedded cross-subdomain by the OpenCloud UI, so setting
# X-Frame-Options: SAMEORIGIN on its responses would block the iframe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencloud-fwd-proto
  namespace: opencloud
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
{{- end }}

