{{- if .Values.collabora.enabled }}
# Service + route for the OpenCloud collaboration (WOPI) sidecar. The selector
# matches the OpenCloud pod (the sidecar shares its network), exposing port 9300.
apiVersion: v1
kind: Service
metadata:
  name: opencloud-collaboration
  namespace: opencloud
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collaboration
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: wopi
      protocol: TCP
      name: http
  selector:
    {{- include "opencloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud-collaboration
  namespace: opencloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: web
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - {{ .Values.collaboration.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: opencloud-fwd-proto
      backendRefs:
        - group: ""
          kind: Service
          name: opencloud-collaboration
          port: 80
          weight: 1
{{- end }}
