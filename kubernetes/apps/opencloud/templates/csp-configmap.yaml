{{- if .Values.collabora.enabled }}
# Custom Content-Security-Policy for the OpenCloud proxy. Based on the upstream
# default, extended so the Web UI (served from publicHostname) may frame the
# Collabora editor and connect to the WOPI service on their own subdomains.
# Referenced via PROXY_CSP_CONFIG_FILE_LOCATION in the opencloud container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-csp
  namespace: opencloud
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
data:
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://{{ .Values.collabora.hostname }}/'
        - 'https://{{ .Values.collaboration.hostname }}/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        - 'https://{{ .Values.collabora.hostname }}/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://{{ .Values.collabora.hostname }}/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
      style-src:
        - '''self'''
        - '''unsafe-inline'''
      worker-src:
        - '''self'''
        - 'blob:'
{{- end }}
