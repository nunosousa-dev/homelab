apiVersion: v1
kind: PersistentVolume
metadata:
  name: opencloud-data-pv
spec:
  capacity:
    storage: {{ .Values.opencloud.data.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.basePath }}/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  namespace: opencloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: opencloud-data-pv
  resources:
    requests:
      storage: {{ .Values.opencloud.data.size }}
