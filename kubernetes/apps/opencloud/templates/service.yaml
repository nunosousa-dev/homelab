apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opencloud.selectorLabels" . | nindent 4 }}
