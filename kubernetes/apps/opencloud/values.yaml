# Single canonical external URL. OpenCloud bakes this into the Web UI config
# and enforces a same-origin CSP, so the instance serves exactly one hostname.
# Internal LAN access uses split-horizon DNS pointing this name at the internal
# Traefik LB IP; public access goes through the router/Cloudflare.
publicHostname: cloud.nunosousa.dev

opencloud:
  image: opencloudeu/opencloud-rolling:3
  # Run as www-data (UID/GID 33).
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
  # Insecure mode disables TLS verification between internal services.
  # We terminate TLS at Traefik and serve plain HTTP on 9200, so this stays false.
  insecure: false
  logLevel: info
  # decomposedfs (default) storage driver. On iSCSI (ext4) the default xattrs
  # metadata backend works fine; messagepack is kept for safety/consistency.
  # Env var: STORAGE_USERS_DECOMPOSEDFS_METADATA_BACKEND.
  metadataBackend: messagepack
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  # Configuration directory (/etc/opencloud) holds the generated config and
  # service secrets. Small and rarely changes; kept on iSCSI block storage.
  config:
    storageClassName: truenas-iscsi-retain
    size: 1Gi
  # Data directory (/var/lib/opencloud) holds all user blobs and metadata.
  # Backed by a dynamic iSCSI PVC (ext4) which supports the extended attributes
  # OpenCloud's storage driver requires. Backup/restore via TrueNAS ZFS
  # snapshots of the underlying zvol.
  data:
    storageClassName: truenas-iscsi-retain
    size: 250Gi

# Online document editing with Collabora Online (CODE).
#
# OpenCloud talks to Collabora through the WOPI protocol, brokered by OpenCloud's
# own "collaboration" service. Both the editor and the broker need their own
# public hostnames because the browser AND the two services reach each other by
# URL (all over HTTPS, terminated at Traefik):
#   - collabora.hostname : the Collabora CODE editor server
#   - collaboration.hostname (WOPI src): OpenCloud's collaboration/WOPI service
collabora:
  enabled: true
  hostname: collabora.nunosousa.dev
  # Collabora CODE image. Update this tag to roll the editor version.
  image: collabora/code:24.04.13.1.1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# OpenCloud collaboration (WOPI) service. Runs as a sidecar in the OpenCloud pod
# so it shares the generated /etc/opencloud secrets and reaches the in-pod nats
# service registry over localhost.
collaboration:
  hostname: wopi.nunosousa.dev
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
