hostname: cloud.local.nunosousa.dev
publicHostname: cloud.nunosousa.dev

opencloud:
  image: opencloudeu/opencloud-rolling:3
  # Run as www-data (UID/GID 33).
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
  # Insecure mode disables TLS verification between internal services.
  # We terminate TLS at Traefik and serve plain HTTP on 9200, so this stays false.
  insecure: false
  logLevel: info
  # decomposedfs (default) storage driver. On iSCSI (ext4) the default xattrs
  # metadata backend works fine; messagepack is kept for safety/consistency.
  # Env var: STORAGE_USERS_DECOMPOSEDFS_METADATA_BACKEND.
  metadataBackend: messagepack
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  # Configuration directory (/etc/opencloud) holds the generated config and
  # service secrets. Small and rarely changes; kept on iSCSI block storage.
  config:
    storageClassName: truenas-iscsi-retain
    size: 1Gi
  # Data directory (/var/lib/opencloud) holds all user blobs and metadata.
  # Backed by a dynamic iSCSI PVC (ext4) which supports the extended attributes
  # OpenCloud's storage driver requires. Backup/restore via TrueNAS ZFS
  # snapshots of the underlying zvol.
  data:
    storageClassName: truenas-iscsi-retain
    size: 250Gi
