apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nunosousa-dev/homelab.git
    targetRevision: main
    path: kubernetes/apps/immich
    directory:
      exclude: "{application.yaml,secrets.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
