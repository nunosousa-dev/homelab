hostname: immich.local.nunosousa.dev

server:
  image: ghcr.io/immich-app/immich-server:v2.7.5
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      # 1 core caused ~98% CPU throttling during uploads (thumbnailing,
      # transcoding, import) -> liveness timeouts, crash-loops, 504s, and
      # ML jobs running before ConfigInit ("repository not been setup").
      memory: "3Gi"
      cpu: "4000m"

machineLearning:
  image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  modelCache:
    storageClassName: truenas-nfs-retain
    size: 10Gi

postgres:
  image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  resources:
    requests:
      memory: "256Mi"
      cpu: "10m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  storage:
    storageClassName: truenas-iscsi-retain
    size: 10Gi

redis:
  image: valkey/valkey:8-bookworm
  resources:
    requests:
      memory: "16Mi"
      cpu: "5m"
    limits:
      memory: "64Mi"
      cpu: "50m"

library:
  nfsServer: 10.0.0.3
  nfsPath: /mnt/data/immich-library
  size: 500Gi
