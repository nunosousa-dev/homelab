apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "secret-santa.name" . }}
spec:
  # Home network: local DNS → Gateway listener with the local wildcard certificate.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.localSectionName }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "secret-santa.name" . }}
          port: 80
          weight: 1
{{- if .Values.publicHostname }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "secret-santa.name" . }}-public
spec:
  # Internet: Cloudflare terminates HTTPS and tunnels plain HTTP to this listener.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.publicSectionName }}
  hostnames:
    - {{ .Values.publicHostname | quote }}
  rules:
    # Organiser pages and APIs stay on the home network; the path is kept.
    - matches:
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /api/admin
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.hostname | quote }}
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "secret-santa.name" . }}
          port: 80
          weight: 1
{{- end }}
