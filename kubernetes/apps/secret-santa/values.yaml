image:
  repository: ghcr.io/nunosousa-dev/secret-santa
  # Required: set the published immutable tag, for example sha-<full-commit-sha>.
  tag: "1.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Home-network hostname (LAN/VPN). With a public hostname, it is the only way into /admin.
hostname: amigo-secreto.local.nunosousa.dev
# Public hostname through the Cloudflare tunnel. When set, it is the canonical APP_URL used by
# editing links and printed QR codes; keep it stable once cards are printed. Empty = local only.
publicHostname: amigo-secreto.nunosousa.dev
admin:
  existingSecret: secret-santa-admin
  secretKey: ADMIN_PASSWORD_HASH
storage:
  storageClassName: truenas-iscsi-retain
  size: 1Gi
gateway:
  name: homelab
  namespace: traefik
  # Serves the local wildcard certificate.
  localSectionName: websecure
  # Cloudflare terminates public HTTPS and tunnels to Traefik's HTTP listener.
  publicSectionName: web
nodeSelector:
  homelab/node-type: vm
  kubernetes.io/arch: amd64
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

backup:
  enabled: true
  schedule: "0 3 * * *"
  timeZone: Europe/Lisbon
  storageClassName: truenas-nfs-retain
  size: 5Gi
