replicaCount: 1

image:
  repository: ghcr.io/nunosousa-dev/website
  # Immutable tag from the website repo's container workflow (sha-<short commit>).
  # Bump it to release a new version; ArgoCD rolls out the change.
  tag: sha-7460957
  pullPolicy: IfNotPresent

# This deployment uses the public GHCR package, so no image-pull secret is needed.
imagePullSecrets: []

hostname: nunosousa.local.nunosousa.dev
publicHostname: nunosousa.dev
# Permanently redirected to publicHostname.
wwwHostname: www.nunosousa.dev

nodeSelector:
  homelab/node-type: vm

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 100m
