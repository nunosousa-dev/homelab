apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nunosousa-website-www-redirect
  namespace: nunosousa-website
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: web
  hostnames:
    - {{ .Values.wwwHostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.publicHostname | quote }}
            statusCode: 301
