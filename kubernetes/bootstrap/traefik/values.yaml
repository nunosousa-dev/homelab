traefik:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  api:
    insecure: true
  providers:
    kubernetesGateway:
      enabled: true
  service:
    type: LoadBalancer
  gateway:
    enabled: false
  ports:
    web:
      port: 80
      expose:
        default: true
    websecure:
      port: 443
      expose:
        default: true
