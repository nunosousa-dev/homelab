apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`data.local.nunosousa.dev`)
      kind: Rule
      services:
        - name: truenas-external
          port: 443
          scheme: https
          serversTransport: truenas-transport
