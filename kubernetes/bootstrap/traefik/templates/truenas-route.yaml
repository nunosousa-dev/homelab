apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: traefik
spec:
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-external
  namespace: traefik
subsets:
  - addresses:
      - ip: 10.0.0.3
    ports:
      - port: 443
        protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  namespace: traefik
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "data.local.nunosousa.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: truenas-external
          port: 443
