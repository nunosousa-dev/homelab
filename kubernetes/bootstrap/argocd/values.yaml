argo-cd:
  configs:
    cm:
      resource.exclusions: |
        - apiGroups:
            - ""
          kinds:
            - Endpoints
          clusters:
            - "*"
          namespaces:
            - "!traefik"

  controller:
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

  server:
    extraArgs:
      - --insecure
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  repoServer:
    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 256Mi

  redis:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  dex:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  notifications:
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  applicationSet:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 96Mi
