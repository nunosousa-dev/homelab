# App of Apps — ArgoCD ApplicationSet
# Apply once manually: kubectl apply -f kubernetes/bootstrap/_apps.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            wave: "0"
          - name: democratic-csi
            namespace: democratic-csi
            wave: "0"
          - name: traefik
            namespace: traefik
            wave: "1"
          - name: reflector
            namespace: reflector
            wave: "1"
          - name: monitoring
            namespace: monitoring
            wave: "2"
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/nunosousa-dev/homelab.git
        targetRevision: HEAD
        path: "kubernetes/bootstrap/{{ .name }}"
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ReplaceCRDs=true
          - ServerSideApply=true
