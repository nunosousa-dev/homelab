# App of Apps — ArgoCD ApplicationSet
# Apply once manually: kubectl apply -f kubernetes/bootstrap/_apps.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: gateway-api-crds
            namespace: default
            wave: "0"
            sourceType: "directory"
            externalRepo: "https://github.com/kubernetes-sigs/gateway-api.git"
            externalPath: "config/crd/standard"
            externalRevision: "v1.5.1"
          - name: cert-manager
            namespace: cert-manager
            wave: "0"
            sourceType: "helm"
          - name: democratic-csi
            namespace: democratic-csi
            wave: "0"
            sourceType: "helm"
          - name: traefik
            namespace: traefik
            wave: "1"
            sourceType: "helm"
          - name: reflector
            namespace: reflector
            wave: "1"
            sourceType: "helm"
          - name: monitoring
            namespace: monitoring
            wave: "2"
            sourceType: "helm"
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/nunosousa-dev/homelab.git
        targetRevision: HEAD
        path: "kubernetes/bootstrap/{{ .name }}"
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ReplaceCRDs=true
          - ServerSideApply=true
  templatePatch: |
    {{- if eq .sourceType "directory" }}
    spec:
      source:
        repoURL: "{{ .externalRepo }}"
        targetRevision: "{{ .externalRevision }}"
        path: "{{ .externalPath }}"
        helm: null
        directory:
          recurse: false
    {{- end }}
