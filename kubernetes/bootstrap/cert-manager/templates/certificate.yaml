apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: all-local-nunosousa-dev
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: all-local-nunosousa-dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.local.nunosousa.dev"
  dnsNames:
    - "local.nunosousa.dev"
    - "*.local.nunosousa.dev"
    # Public hostname for OpenCloud. Needed on the Traefik gateway cert because
    # OpenCloud's proxy validates OIDC tokens by calling its own issuer
    # (OC_URL=https://cloud.nunosousa.dev) over an in-cluster loopback to Traefik.
    # Without a matching cert Traefik serves its default self-signed cert and
    # token verification fails ("Not logged in"). Also fixes internal (split-DNS)
    # browser cert warnings for this host.
    - "cloud.nunosousa.dev"
    # Collabora Online editor and OpenCloud WOPI service. The collaboration
    # service and Collabora verify each other's TLS over the same loopback to
    # Traefik, so both hostnames must be on the gateway cert.
    - "collabora.nunosousa.dev"
    - "wopi.nunosousa.dev"
