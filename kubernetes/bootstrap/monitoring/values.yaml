kube-prometheus-stack:
  prometheus-node-exporter:
    hostNetwork: true
    hostPID: true
    tolerations:
      - operator: Exists

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi

  grafana:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    additionalDataSources:
      - name: Mimir Long Term
        uid: mimir-long-term
        type: prometheus
        access: proxy
        url: http://mimir:9009/prometheus
        isDefault: false
        jsonData:
          httpMethod: POST
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: homelab
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false

  prometheus:
    prometheusSpec:
      retention: 30d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: truenas-nfs-retain
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      remoteWrite:
        - url: http://mimir:9009/api/v1/push
          headers:
            X-Scope-OrgID: homelab
          writeRelabelConfigs:
            - action: keep
              sourceLabels:
                - long_term_metrics
              regex: "true"

grafana:
  hostname: grafana.local.nunosousa.dev

mimir:
  enabled: true
  replicas: 3
  replicationFactor: 3
  memberlist:
    port: 7946
  image:
    repository: grafana/mimir
    tag: 2.17.3
    pullPolicy: IfNotPresent
  retention: 1y
  storage:
    storageClassName: truenas-nfs-retain
    size: 20Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  enabled: true
  replicas: 1
  replicationFactor: 1
  memberlist:
    port: 7946
  image:
    repository: grafana/loki
    tag: 3.4.2
    pullPolicy: IfNotPresent
  retention: 720h
  storage:
    storageClassName: truenas-nfs-retain
    size: 20Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

alloy:
  enabled: true
  image:
    repository: grafana/alloy
    tag: v1.8.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
