{{- if .Values.mimir.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: memberlist
      port: {{ .Values.mimir.memberlist.port }}
      targetPort: memberlist
{{- end }}
