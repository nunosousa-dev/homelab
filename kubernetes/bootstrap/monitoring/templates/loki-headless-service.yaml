{{- if .Values.loki.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: memberlist
      port: {{ .Values.loki.memberlist.port }}
      targetPort: memberlist
{{- end }}
