apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: all-local-nunosousa-dev
  namespace: default
spec:
  secretName: all-local-nunosousa-dev
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "*.local.nunosousa.dev"
  dnsNames:
  - "local.nunosousa.dev"
  - "*.local.nunosousa.dev"
