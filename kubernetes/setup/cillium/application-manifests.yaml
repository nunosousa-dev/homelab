apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nunosousa-dev/homelab.git
    targetRevision: main
    path: kubernetes/setup/cillium
    directory:
      exclude: "{README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
