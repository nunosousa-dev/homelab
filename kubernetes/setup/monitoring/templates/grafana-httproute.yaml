apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: traefik
      sectionName: websecure
  hostnames:
    - {{ .Values.grafana.hostname | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-grafana
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /