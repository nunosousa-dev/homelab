kube-prometheus-stack:
  grafana:
    enabled: true

  prometheus:
    prometheusSpec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        runAsNonRoot: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs-retain
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi

grafana:
  hostname: grafana.local.nunosousa.dev