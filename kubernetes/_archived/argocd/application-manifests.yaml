apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nunosousa-dev/homelab.git
    targetRevision: main
    path: kubernetes/setup/argocd
    directory:
      exclude: "{application.yaml,application-manifests.yaml,values.yaml,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
