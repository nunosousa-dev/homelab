apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/nunosousa-dev/homelab.git
      targetRevision: main
      path: kubernetes/setup/monitoring
      helm:
        valueFiles:
          - values.yaml
    - repoURL: https://github.com/nunosousa-dev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
