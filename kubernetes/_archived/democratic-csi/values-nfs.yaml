csiDriver:
  # Must be globally unique within the cluster
  name: "org.democratic-csi.truenas-nfs"
  fsGroupPolicy: File

storageClasses:
  - name: truenas-nfs-retain
    defaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
    mountOptions:
      - nfsvers=4.1
      - noatime
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

  - name: truenas-nfs
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
    mountOptions:
      - nfsvers=4.1
      - noatime
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

volumeSnapshotClasses: []

driver:
  config:
    driver: freenas-api-nfs
    instance_id: homelab-nfs
    httpConnection:
      protocol: https
      host: 10.0.0.3
      port: 443
      # Generate an API key in TrueNAS: System > API Keys > Add
      apiKey: 2-NJZ2WlPLmgIGwSMESKaCYukyCDxistwvjMgaa7p75rXJddWE3goC7bQ4miy0K6YF
      allowInsecure: true
    zfs:
      datasetParentName: data/k8s-nfs/vols
      # Must not overlap with datasetParentName; leave as-is if not using snapshots
      detachedSnapshotsDatasetParentName: data/k8s-nfs/snaps
      datasetEnableQuotas: true
      datasetEnableReservation: false
      datasetPermissionsMode: "0777"
      datasetPermissionsUser: 0
      datasetPermissionsGroup: 0
    nfs:
      shareHost: 10.0.0.3
      shareAlldirs: false
      shareAllowedHosts: []
      shareAllowedNetworks: []
      shareMaprootUser: root
      shareMaprootGroup: root
      shareMapallUser: ""
      shareMapallGroup: ""
