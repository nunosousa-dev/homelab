csiDriver:
  # Must be globally unique within the cluster
  name: "org.democratic-csi.truenas-iscsi"

storageClasses:
  - name: truenas-iscsi-retain
    defaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      # ext4 for block storage
      fsType: ext4
    mountOptions: []
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

volumeSnapshotClasses: []

# Required for Talos Linux iSCSI support
node:
  hostPID: true
  driver:
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    iscsiDirHostPath: /etc/iscsi
    iscsiDirHostPathType: ""

driver:
  config:
    driver: freenas-api-iscsi
    instance_id: homelab-iscsi
    httpConnection:
      protocol: https
      host: 10.0.0.3
      port: 443
      # Generate an API key in TrueNAS: System > API Keys > Add
      apiKey: 2-NJZ2WlPLmgIGwSMESKaCYukyCDxistwvjMgaa7p75rXJddWE3goC7bQ4miy0K6YF
      allowInsecure: true
    zfs:
      datasetParentName: data/k8s-iscsi/vols
      # Must not overlap with datasetParentName; leave as-is if not using snapshots
      detachedSnapshotsDatasetParentName: data/k8s-iscsi/snaps
      zvolCompression: ""
      zvolDedup: ""
      zvolEnableReservation: false
      # 16K is a good default for general workloads; 8K can improve Postgres performance
      zvolBlocksize: "16K"
    iscsi:
      targetPortal: "10.0.0.3:3260"
      interface: ""
      namePrefix: csi-
      nameSuffix: "-homelab"
      targetGroups:
          # Fill in the correct IDs from TrueNAS iSCSI config.
          # Query with: curl -H "Authorization: Bearer <apikey>" https://10.0.0.3/api/v2.0/iscsi/portal
          # Query with: curl -H "Authorization: Bearer <apikey>" https://10.0.0.3/api/v2.0/iscsi/initiator
        - targetGroupPortalGroup: 1
          targetGroupInitiatorGroup: 1
          targetGroupAuthType: None
      extentInsecureTpc: true
      extentXenCompat: false
      extentDisablePhysicalBlocksize: true
      extentBlocksize: 512
      extentRpm: "SSD"
      extentAvailThreshold: 0
